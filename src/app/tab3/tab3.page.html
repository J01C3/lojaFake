<ion-content class="ion-padding">

<ion-button
  class="toggle-btn"
  expand="block"
  fill="solid"
  (click)="toggle()">
  {{ show ? 'Ocultar produtos' : 'Mostrar produtos' }}
</ion-button>

  <div *ngIf="show">

    <ion-card *ngFor="let p of products; let i = index">

      <div class="counter">
        {{ i + 1 }} / {{ products.length }}
      </div>

      <img [src]="p.image" />

      <ion-card-header>
        <ion-card-title class="title">
          {{ p.title }}
        </ion-card-title>

        <ion-card-subtitle class="price">
          <ion-icon name="cart-outline"></ion-icon>
          R$ {{ p.price }}
        </ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        {{ p.description }}
      </ion-card-content>

    </ion-card>

  </div>

</ion-content>
